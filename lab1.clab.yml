name: lab1

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.4.4
      exec:
        - ip addr add 10.0.0.1/30 dev eth1
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.4.4
      exec:
        - ip addr add 10.0.0.2/30 dev eth1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]