name: lab3

topology:
  nodes:
    sw1:
      kind: linux
      image: quay.io/frrouting/frr:10.4.4
      exec:
        - ip link add br0 type bridge vlan_filtering 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        - bridge vlan del dev eth1 vid 1
        - bridge vlan del dev eth2 vid 1
        - bridge vlan del dev eth3 vid 1
        - bridge vlan del dev eth4 vid 1
        - bridge vlan add dev eth1 vid 10 pvid untagged
        - bridge vlan add dev eth2 vid 10 pvid untagged
        - bridge vlan add dev eth3 vid 20 pvid untagged
        - bridge vlan add dev eth4 vid 10
        - bridge vlan add dev eth4 vid 20
    sw2:
      kind: linux
      image: quay.io/frrouting/frr:10.4.4
      exec:
        - ip link add br0 type bridge vlan_filtering 1
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - bridge vlan del dev eth1 vid 1
        - bridge vlan del dev eth2 vid 1
        - bridge vlan del dev eth3 vid 1
        - bridge vlan add dev eth1 vid 10 pvid untagged
        - bridge vlan add dev eth2 vid 20 pvid untagged
        - bridge vlan add dev eth3 vid 10
        - bridge vlan add dev eth3 vid 20
    h1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 192.168.10.1/24 dev eth1
    h2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 192.168.10.2/24 dev eth1
    h3:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 192.168.10.3/24 dev eth1
    h4:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 192.168.10.4/24 dev eth1
    h5:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 192.168.10.5/24 dev eth1

  links:
    - endpoints: ["sw1:eth1", "h1:eth1"]
    - endpoints: ["sw1:eth2", "h2:eth1"]
    - endpoints: ["sw1:eth3", "h3:eth1"]
    - endpoints: ["sw1:eth4", "sw2:eth3"]
    - endpoints: ["sw2:eth1", "h4:eth1"]
    - endpoints: ["sw2:eth2", "h5:eth1"]